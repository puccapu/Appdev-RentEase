<!DOCTYPE html>
<html lang="en">
<head>

<body>

    <div class="contact-page">

        <!--
            SECTION: Brand

            SECTION: Contact Cards

            <div class="contact-card">

                    <a class="detail-row" href="tel:+639170000001">
                        <div class="detail-icon"><i class="bi bi-telephone-fill"></i></div>
                        <div class="detail-info">
                            <div class="detail-label">Phone</div>
                            <div class="detail-value">+63 917 000 0001</div>
                        </div>
                    </a>
                    <a class="detail-row" href="mailto:kintanarfrancis693@gmail.com">
                        <div class="detail-icon"><i class="bi bi-envelope-fill"></i></div>
                        <div class="detail-info">
                            <div class="detail-label">Email</div>
                            <div class="detail-value">kintanarfrancis693@gmail.com</div>
                        </div>
                    </a>
                </div>

                <a class="github-btn" href="https://github.com/CHROMAPSTR" target="_blank" rel="noopener noreferrer">
                    <i class="bi bi-github"></i> View GitHub

            </div>

            <div class="contact-card">
                <div class="avatar-ring">
                    <img src="https://github.com/ryuu-script.png" alt="Christian J. Salang" />

                            <div class="detail-value">+63 917 000 0002</div>

                    <a class="detail-row" href="mailto:christian296112@gmail.com">

                            <div class="detail-label">Email</div>
                            <div class="detail-value">christian296112@gmail.com</div>
                        </div>

        <a class="back-link" href="/index.html"><i class="bi bi-arrow-left"></i> Back to Login</a>
