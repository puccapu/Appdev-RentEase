<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RENTEASE · Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/index.css"/>
</head>
<body>

    <div class="auth-container">

        <div class="demo-badge"><i class="bi bi-shield-check"></i> Secure</div>

        <!--
            SECTION: Brand
            Purpose: Shows the RentEase logo, name, and tagline above the login form.
        -->
        <div class="brand">
            <div class="brand-icon">
                <img src="https://raw.githubusercontent.com/CHROMAPSTR/GRAPHIC-DESIGNS/refs/heads/main/Copy%20of%20rreeeeeeeee%20(16).png" alt="RENTEASE" />
            </div>
            <h1>RENTEASE</h1>
            <div class="tagline">Rent with <span>ease</span> · Trust &amp; speed</div>
        </div>

        <!--
            SECTION: Login Panel
            Purpose: The username/PIN login form, including the PIN visibility
            toggle, PIN progress dots, and submit button with its loading state.
        -->
        <div class="form-panel" id="panelLogin">
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="loginName"><i class="bi bi-person-fill"></i> Username</label>
                    <div class="input-wrap">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" id="loginName" placeholder="Enter your username" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPin"><i class="bi bi-key-fill"></i> PIN Code</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" id="loginPin" placeholder="••••" maxlength="4" inputmode="numeric" required />
                        <button type="button" class="toggle-eye" onclick="togglePinVisibility('loginPin', this)" tabindex="-1">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                    <div class="pin-dots-wrap" id="loginDots">
                        <div class="pin-dot" id="ld0"></div>
                        <div class="pin-dot" id="ld1"></div>
                        <div class="pin-dot" id="ld2"></div>
                        <div class="pin-dot" id="ld3"></div>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="loginBtn">
                    <span class="btn-text"><i class="bi bi-lightning-charge-fill"></i> Login</span>
                    <span class="spinner"></span>
                </button>

                <div class="form-message" id="loginMessage"></div>

                <a href="/contact.html" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
            </form>
            <div class="auth-footer">
                <i class="bi bi-shield-lock"></i> Authorized user access only
            </div>
        </div>

    </div>

    <script src="/js/index.js"></script>

</body>
</html>
