<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RENTEASE · Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        /* ─── ROOT ─── */
        :root {
            --primary: #002A32;
            --primary-light: #003d47;
            --secondary: #ED254E;
            --secondary-dim: rgba(237, 37, 78, 0.15);
            --secondary-glow: rgba(237, 37, 78, 0.3);
            --bg: #0b1215;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            --text: #f0edf5;
            --muted: rgba(240, 237, 245, 0.5);
            --radius: 24px;
            --radius-sm: 12px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0, 42, 50, 0.7) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(237, 37, 78, 0.15) 0%, transparent 50%),
                var(--bg);
            padding: 20px;
            margin: 0;
        }

        /* ─── MAIN CARD — Apple‑style glass ─── */
        .auth-container {
            width: 100%;
            max-width: 460px;
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(1.2);
            -webkit-backdrop-filter: blur(40px) saturate(1.2);
            border-radius: var(--radius);
            padding: 44px 36px 38px;
            border: 1px solid var(--glass-border);
            box-shadow:
                var(--glass-shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.4s ease;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.08), transparent 70%);
            pointer-events: none;
            border-radius: 50%;
            filter: blur(20px);
        }

        .auth-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        }

        /* ─── BRANDING ─── */
        .brand {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 14px;
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .brand-icon img {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: brightness(0) saturate(100%) invert(27%) sepia(89%) saturate(3000%) hue-rotate(340deg) brightness(95%) contrast(95%);
        }

        .brand-icon:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        .brand h1 {
            font-family: "Syne", sans-serif;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 40%, rgba(255, 255, 255, 0.65));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .brand .tagline {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 4px;
            -webkit-text-fill-color: var(--muted);
        }

        .brand .tagline span {
            color: var(--secondary);
            -webkit-text-fill-color: var(--secondary);
            font-weight: 700;
        }

        /* ─── FORM ─── */
        .form-panel {
            animation: fadeSlide 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .form-group label i {
            font-size: 14px;
            color: var(--secondary);
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--muted);
            pointer-events: none;
            transition: color 0.25s;
        }

        .input-wrap:focus-within .input-icon {
            color: var(--secondary);
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: "Inter", sans-serif;
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }

        .input-wrap input::placeholder {
            color: rgba(240, 237, 245, 0.25);
            font-weight: 400;
            font-size: 14px;
        }

        .input-wrap input:focus {
            border-color: var(--secondary);
            background: rgba(237, 37, 78, 0.06);
            box-shadow: 0 0 0 4px rgba(237, 37, 78, 0.08);
        }

        .input-wrap input.error {
            border-color: var(--secondary) !important;
            box-shadow: 0 0 0 4px rgba(237, 37, 78, 0.12) !important;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .input-wrap .toggle-eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--muted);
            font-size: 17px;
            cursor: pointer;
            padding: 0;
            transition: color 0.2s;
            line-height: 1;
        }

        .input-wrap .toggle-eye:hover {
            color: var(--text);
        }

        /* PIN dots */
        .pin-dots-wrap {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 6px 0 14px;
        }

        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: transparent;
            transition: all 0.2s ease;
        }

        .pin-dot.filled {
            background: var(--secondary);
            border-color: var(--secondary);
            transform: scale(1.15);
            box-shadow: 0 0 16px rgba(237, 37, 78, 0.35);
        }

        .pin-dot.error-dot {
            background: var(--secondary);
            border-color: var(--secondary);
            animation: shake 0.4s ease;
        }

        /* ─── SUBMIT ─── */
        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--secondary), #d11f44);
            color: #fff;
            font-family: "Syne", sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 24px rgba(237, 37, 78, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(237, 37, 78, 0.45);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .submit-btn .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .submit-btn.loading .spinner {
            display: block;
        }
        .submit-btn.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ─── MESSAGES ─── */
        .form-message {
            font-size: 12px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-top: 12px;
            display: none;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(8px);
        }

        .form-message.show {
            display: flex;
        }

        .form-message.error {
            background: rgba(237, 37, 78, 0.12);
            border: 1px solid rgba(237, 37, 78, 0.2);
            color: var(--secondary);
        }

        .form-message.success {
            background: rgba(46, 205, 204, 0.08);
            border: 1px solid rgba(46, 205, 204, 0.2);
            color: #2ecdcc;
        }

        /* ─── FOOTER ─── */
        .auth-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 11px;
            color: var(--muted);
            position: relative;
            z-index: 1;
            letter-spacing: 0.3px;
        }

        .auth-footer span {
            color: var(--secondary);
            font-weight: 600;
        }

        /* ─── DEMO BADGE ─── */
        .demo-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(237, 37, 78, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(237, 37, 78, 0.15);
            color: var(--secondary);
            z-index: 2;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 20px 28px;
                border-radius: 18px;
            }
            .brand h1 {
                font-size: 24px;
            }
            .brand-icon {
                width: 60px;
                height: 60px;
            }
            .brand-icon img {
                width: 40px;
                height: 40px;
            }
            .input-wrap input {
                font-size: 14px;
                padding: 12px 14px 12px 40px;
            }
            .pin-dot {
                width: 12px;
                height: 12px;
                gap: 10px;
            }
        }

        @media (max-width: 380px) {
            .auth-container {
                padding: 24px 16px 22px;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="auth-container">

        <div class="demo-badge"><i class="bi bi-shield-check"></i> Secure</div>

        <!-- BRAND -->
        <div class="brand">
            <div class="brand-icon">
                <img src="https://raw.githubusercontent.com/CHROMAPSTR/GRAPHIC-DESIGNS/refs/heads/main/Copy%20of%20rreeeeeeeee%20(16).png" alt="RENTEASE" />
            </div>
            <h1>RENTEASE</h1>
            <div class="tagline">Rent with <span>ease</span> · Trust &amp; speed</div>
        </div>

        <!-- ─── LOGIN PANEL ─── -->
        <div class="form-panel" id="panelLogin">
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="loginName"><i class="bi bi-person-fill"></i> Username</label>
                    <div class="input-wrap">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" id="loginName" placeholder="Enter your username" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPin"><i class="bi bi-key-fill"></i> PIN Code</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" id="loginPin" placeholder="••••" maxlength="4" inputmode="numeric" required />
                        <button type="button" class="toggle-eye" onclick="togglePinVisibility('loginPin', this)" tabindex="-1">
                            <i class="bi bi-eye-slash"></i>
                        </button>
                    </div>
                    <div class="pin-dots-wrap" id="loginDots">
                        <div class="pin-dot" id="ld0"></div>
                        <div class="pin-dot" id="ld1"></div>
                        <div class="pin-dot" id="ld2"></div>
                        <div class="pin-dot" id="ld3"></div>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="loginBtn">
                    <span class="btn-text"><i class="bi bi-lightning-charge-fill"></i> Login</span>
                    <span class="spinner"></span>
                </button>

                <div class="form-message" id="loginMessage"></div>
            </form>
            <div class="auth-footer">
                <i class="bi bi-shield-lock"></i> Admin access only · <span>demo: admin / 2121</span>
            </div>
        </div>

    </div>

    <script>
        /* ═══════════════════════════════════════════
           RENTEASE — LOGIN (admin only)
           ═══════════════════════════════════════════ */

        // ─── DOM REFS ───
        const loginForm = document.getElementById('loginForm');
        const loginMsg = document.getElementById('loginMessage');
        const loginBtn = document.getElementById('loginBtn');

        // ─── PIN DOT HELPERS ───
        function updateDots(inputId, dotPrefix) {
            const input = document.getElementById(inputId);
            const val = input ? input.value : '';
            const len = Math.min(val.length, 4);
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(dotPrefix + i);
                if (!dot) continue;
                dot.classList.remove('filled', 'error-dot');
                if (i < len) dot.classList.add('filled');
            }
        }

        function markDotsError(dotPrefix) {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(dotPrefix + i);
                if (!dot) continue;
                dot.classList.remove('filled');
                dot.classList.add('error-dot');
            }
            setTimeout(() => {
                for (let i = 0; i < 4; i++) {
                    const dot = document.getElementById(dotPrefix + i);
                    if (dot) dot.classList.remove('error-dot');
                }
            }, 700);
        }

        // ─── TOGGLE PIN VISIBILITY ───
        window.togglePinVisibility = function(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye-slash';
            }
        };

        // ─── PIN INPUT SYNC ───
        document.getElementById('loginPin').addEventListener('input', function() {
            updateDots('loginPin', 'ld');
            this.value = this.value.replace(/\D/g, '').slice(0, 4);
        });

        // ─── SHOW MESSAGE ───
        function showMessage(el, text, type = 'error') {
            el.textContent = text;
            el.className = 'form-message show ' + type;
        }

        function clearMessage(el) {
            el.className = 'form-message';
            el.textContent = '';
        }

        function setLoading(btn, loading) {
            btn.classList.toggle('loading', loading);
            btn.disabled = loading;
        }

        // ─── LOGIN (hardcoded admin) ───
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            clearMessage(loginMsg);

            const name = document.getElementById('loginName').value.trim();
            const pin = document.getElementById('loginPin').value.trim();

            if (!name) {
                showMessage(loginMsg, 'Please enter your username.', 'error');
                document.getElementById('loginName').focus();
                return;
            }

            if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
                showMessage(loginMsg, 'PIN must be exactly 4 digits.', 'error');
                markDotsError('ld');
                document.getElementById('loginPin').focus();
                return;
            }

            // ─── HARDCODED ADMIN CHECK ───
            if (name.toLowerCase() === 'admin' && pin === '2121') {
                // ✅ Success
                showMessage(loginMsg, '✅ Welcome, Admin! Redirecting…', 'success');
                setLoading(loginBtn, true);

                sessionStorage.setItem('rentease_session', JSON.stringify({
                    user: 'Admin',
                    loginTime: Date.now()
                }));

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            } else {
                // ❌ Invalid credentials
                showMessage(loginMsg, 'Invalid username or PIN. Please try again.', 'error');
                markDotsError('ld');
                document.getElementById('loginPin').value = '';
                updateDots('loginPin', 'ld');
                document.getElementById('loginPin').focus();
            }
        });

        // ─── ENTER KEY ON PIN FIELD ───
        document.getElementById('loginPin').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.length === 4) {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });

        // ─── CHECK EXISTING SESSION ───
        const session = sessionStorage.getItem('rentease_session');
        if (session) {
            try {
                const data = JSON.parse(session);
                if (data.user && (Date.now() - data.loginTime) < 3600000) {
                    // Already logged in – redirect to dashboard
                    window.location.href = 'index.html';
                }
            } catch {}
        }

        console.log('🔐 RENTEASE Login ready — use admin / 2121');
    </script>

</body>
</html>
