<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentEase · Profile & Employees</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ---------- Dark Mode CSS Variables ---------- */
        :root {
            --primary-light: #003d47;
            --secondary: #ED254E;
            --glass-bg: rgba(12, 25, 33, 0.65);
            --glass-border: rgba(255, 255, 255, 0.07);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --card-radius: 24px;
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at 20% 20%, #0a2a33, #020617 80%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            max-width: 1200px;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: var(--card-radius);
            box-shadow: var(--glass-shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
            padding: 28px 32px 40px;
            transition: all 0.2s ease;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 32px;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .logo img {
            height: 40px;
            width: auto;
            display: block;
            filter: brightness(0) saturate(100%) invert(27%) sepia(89%) saturate(3000%) hue-rotate(340deg) brightness(95%) contrast(95%);
        }
        .logo span {
            color: #fff;
        }

        .api-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 10px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.15);
        }
        .api-badge i {
            font-size: 0.7rem;
        }
        .api-badge.off {
            background: rgba(100, 116, 139, 0.08);
            color: #64748b;
            border-color: rgba(255, 255, 255, 0.05);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px 16px;
            flex-wrap: wrap;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.95rem;
            padding: 8px 16px;
            border-radius: 40px;
            transition: all 0.25s ease;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .nav-links a i {
            margin-right: 6px;
        }
        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }
        .nav-links a.active {
            background: var(--primary-light);
            color: #ffffff;
            border-color: var(--primary-light);
            box-shadow: 0 0 20px rgba(0, 61, 71, 0.3);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(6px);
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            position: relative;
            z-index: 10;
        }
        .user-profile img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .user-profile span {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.9rem;
        }
        .user-profile i.fa-chevron-down {
            color: var(--text-muted);
            font-size: 0.7rem;
            transition: transform 0.2s;
        }

        .profile-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #0f1e26;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            min-width: 180px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 8px 0;
            z-index: 100;
        }
        .profile-dropdown.open {
            display: block;
        }
        .profile-dropdown a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.15s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .profile-dropdown a:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
        }
        .profile-dropdown a i {
            width: 20px;
            text-align: center;
            color: var(--secondary);
        }
        .profile-dropdown .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
            margin: 6px 12px;
        }

        .hero {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
        }
        .hero h1 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .hero h1 small {
            display: block;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .hero-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: var(--primary-light);
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(0, 61, 71, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 61, 71, 0.6);
        }
        .btn-primary.sm {
            padding: 6px 14px;
            font-size: 0.8rem;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: rgba(237, 37, 78, 0.2);
            color: #f43f5e;
            border: 1px solid rgba(237, 37, 78, 0.2);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-danger:hover {
            background: rgba(237, 37, 78, 0.35);
            border-color: rgba(237, 37, 78, 0.4);
        }
        .btn-edit {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.15);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-edit:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .action-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .page-section {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 22px 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .glass-panel h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .glass-panel h3 i {
            color: var(--secondary);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .section-header h2 i {
            color: var(--secondary);
            margin-right: 10px;
        }
        .section-header .sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 400;
        }

        .table-responsive {
            overflow-x: auto;
            margin-top: 4px;
        }
        table.sim-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        table.sim-table th {
            text-align: left;
            padding: 12px 10px;
            color: var(--text-secondary);
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.3px;
        }
        table.sim-table td {
            padding: 12px 10px;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            vertical-align: middle;
        }
        table.sim-table tr:last-child td {
            border-bottom: none;
        }
        table.sim-table .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge.admin {
            background: rgba(237, 37, 78, 0.15);
            color: #f43f5e;
        }
        .badge.manager {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
        }
        .badge.staff {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-secondary);
        }
        .empty-state i {
            font-size: 2.5rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 0.95rem;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #0f1e26;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px 36px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .modal .modal-header h2 {
            color: var(--text-primary);
            font-size: 1.4rem;
            font-weight: 600;
        }
        .modal .modal-header h2 i {
            color: var(--secondary);
            margin-right: 10px;
        }
        .modal .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.2s;
            padding: 4px 8px;
        }
        .modal .modal-close:hover {
            color: #ffffff;
        }

        .modal .form-group {
            margin-bottom: 18px;
        }
        .modal .form-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 5px;
        }
        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(0, 61, 71, 0.25);
        }
        .modal .form-group input::placeholder {
            color: var(--text-muted);
        }
        .modal .form-group select option {
            background: #0f1e26;
            color: var(--text-primary);
        }

        .modal .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: flex-end;
        }
        .modal .form-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal .form-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
        }
        .modal .form-actions .btn-submit {
            background: var(--primary-light);
            color: #ffffff;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(0, 61, 71, 0.3);
        }
        .modal .form-actions .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 61, 71, 0.5);
        }
        .modal .form-actions .btn-submit.danger {
            background: #b91c1c;
            box-shadow: 0 4px 16px rgba(185, 28, 28, 0.3);
        }
        .modal .form-actions .btn-submit.danger:hover {
            box-shadow: 0 8px 24px rgba(185, 28, 28, 0.5);
        }

        .modal .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(12, 25, 33, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 24px;
            color: var(--text-primary);
            font-size: 0.9rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .toast i {
            font-size: 1.3rem;
            color: #10b981;
        }
        .toast.error i {
            color: #f43f5e;
        }
        .toast.warning i {
            color: #f59e0b;
        }

        .footer-note {
            margin-top: 32px;
            font-size: 0.75rem;
            text-align: center;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 20px;
            letter-spacing: 0.3px;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .nav-links {
                order: 2;
                justify-content: center;
                flex-wrap: wrap;
            }
            .user-profile {
                order: 1;
                align-self: flex-end;
            }
            .logo {
                order: 0;
                align-self: center;
            }
            .hero {
                flex-direction: column;
                align-items: stretch;
                gap: 20px;
            }
            .hero-actions {
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .app-container {
                padding: 16px 18px;
            }
            .hero h1 {
                font-size: 1.6rem;
            }
            .nav-links a {
                font-size: 0.85rem;
                padding: 6px 12px;
            }
            table.sim-table {
                font-size: 0.8rem;
            }
            table.sim-table th,
            table.sim-table td {
                padding: 8px 6px;
            }
            .modal .form-row {
                grid-template-columns: 1fr;
            }
            .modal {
                padding: 24px 20px;
            }
        }
        @media (max-width: 500px) {
            .hero-actions .btn-primary,
            .hero-actions .btn-secondary {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- ========== SESSION CHECK ========== -->
    <script>
        (function() {
            const sessionData = sessionStorage.getItem('rentease_session');
            if (!sessionData) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const session = JSON.parse(sessionData);
                if (Date.now() - session.loginTime > 3600000) {
                    sessionStorage.removeItem('rentease_session');
                    window.location.href = 'login.html';
                    return;
                }
                window.__loggedUser = session.user || 'Admin';
            } catch (e) {
                window.location.href = 'login.html';
            }
        })();
    </script>

    <div class="app-container">

        <!-- ========== NAVIGATION ========== -->
        <nav class="navbar">
            <div class="logo">
                <img src="https://raw.githubusercontent.com/CHROMAPSTR/GRAPHIC-DESIGNS/refs/heads/main/Copy%20of%20rreeeeeeeee%20(16).png" alt="RentEase" />
                <span>RentEase</span>
                <span class="api-badge" id="apiBadge"><i class="fas fa-cloud"></i> API</span>
            </div>
            <!-- Removed the "Dashboard" link from nav-links -->
            <div class="nav-links" id="navLinks">
                <a class="active" data-section="employees"><i class="fas fa-user-tie"></i> Employees</a>
            </div>
            <div class="user-profile" id="profileBtn">
                <img src="https://ui-avatars.com/api/?name=Admin&background=003d47&color=fff&size=36" alt="User" />
                <span id="profileUsername">Admin</span>
                <i class="fas fa-chevron-down"></i>
                <div class="profile-dropdown" id="profileDropdown">
                    <a data-action="profile"><i class="fas fa-user-cog"></i> Profile</a>
                    
                    <div class="divider"></div>
                    <a data-action="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </nav>

        <!-- ========== HERO ========== -->
        <div class="hero">
            <h1>
                Employee Management
                <small>Manage your team members and their roles.</small>
            </h1>
            <div class="hero-actions">
                <button class="btn-primary" id="addEmployeeBtn"><i class="fas fa-user-plus"></i> Add Employee</button>
                <button class="btn-secondary" id="backBtn"><i class="fas fa-arrow-left"></i> Back to Dashboard</button>
            </div>
        </div>

        <!-- ========== EMPLOYEES SECTION ========== -->
        <div id="section-employees" class="page-section">
            <div class="section-header">
                <h2><i class="fas fa-user-tie"></i> All Employees <span class="sub" id="employeeCount">· 0 total</span></h2>
            </div>
            <div class="glass-panel" style="padding:16px 18px;">
                <div class="table-responsive">
                    <table class="sim-table">
                        <thead>
                            <tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th style="text-align:center;">Actions</th></tr>
                        </thead>
                        <tbody id="employeesTableBody">
                            <!-- populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="footer-note">RentEase v1.0 · Employee Management</div>
    </div>

    <!-- ========== MODALS ========== -->

    <div class="modal-overlay" id="employeeModal">
        <div class="modal">
            <div class="modal-header">
                <h2><i class="fas fa-user-tie"></i> <span id="employeeModalTitle">Add Employee</span></h2>
                <button class="modal-close" data-close="employeeModal">&times;</button>
            </div>
            <form id="employeeForm" autocomplete="off">
                <input type="hidden" id="employeeFormId" value="" />
                <div class="form-group">
                    <label for="employeeName">Full Name</label>
                    <input type="text" id="employeeName" placeholder="Full name" required />
                </div>
                <div class="form-group">
                    <label for="employeeEmail">Email Address</label>
                    <input type="email" id="employeeEmail" placeholder="employee@email.com" />
                </div>
                <div class="form-group">
                    <label for="employeePhone">Phone Number</label>
                    <input type="text" id="employeePhone" placeholder="+63 912 345 6789" />
                </div>
                <div class="form-group">
                    <label for="employeeRole">Role</label>
                    <select id="employeeRole">
                        <option value="Admin">Admin</option>
                        <option value="Manager">Manager</option>
                        <option value="Staff">Staff</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" data-close="employeeModal">Cancel</button>
                    <button type="submit" class="btn-submit" id="employeeSubmitBtn"><i class="fas fa-save"></i> Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal">
        <div class="modal" style="max-width:400px;">
            <div class="modal-header">
                <h2><i class="fas fa-exclamation-triangle" style="color:#f43f5e;"></i> Confirm Delete</h2>
                <button class="modal-close" data-close="confirmModal">&times;</button>
            </div>
            <p style="color:var(--text-secondary); margin-bottom:20px; font-size:0.95rem;" id="confirmMessage">Are you sure you want to delete this employee?</p>
            <div class="form-actions" style="justify-content:flex-end;">
                <button type="button" class="btn-cancel" data-close="confirmModal">Cancel</button>
                <button type="button" class="btn-submit danger" id="confirmDeleteBtn"><i class="fas fa-trash"></i> Delete</button>
            </div>
        </div>
    </div>

    <!-- ========== TOAST ========== -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <!-- ========== JAVASCRIPT ========== -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            //  🚀  REST API CONFIGURATION (shared with main page)
            // ============================================================
            const USE_API = true;
            const API_BASE_URL = 'https://your-api-domain.com/api';

            const ApiService = {
                async _fetch(endpoint, options = {}) {
                    if (!USE_API) return null;
                    const url = `${API_BASE_URL}${endpoint}`;
                    const headers = {
                        'Content-Type': 'application/json',
                        ...(localStorage.getItem('api_token') ? { 'Authorization': 'Bearer ' + localStorage
                                .getItem('api_token') } : {}),
                        ...options.headers,
                    };
                    const response = await fetch(url, { ...options, headers });
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.message || `HTTP ${response.status}`);
                    }
                    return response.json();
                },
                getEmployees: () => ApiService._fetch('/employees'),
                createEmployee: (data) => ApiService._fetch('/employees', { method: 'POST', body: JSON.stringify(data) }),
                updateEmployee: (id, data) => ApiService._fetch(`/employees/${id}`, { method: 'PUT', body: JSON.stringify(data) }),
                deleteEmployee: (id) => ApiService._fetch(`/employees/${id}`, { method: 'DELETE' }),
            };

            // ============================================================
            //  DATA LAYER
            // ============================================================
            const STORAGE_KEY_EMPLOYEES = 'rentease_employees';
            let employees = [];

            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            }

            function getStatusBadge(status) {
                const map = {
                    'Admin': 'admin',
                    'Manager': 'manager',
                    'Staff': 'staff'
                };
                const cls = map[status] || 'pending';
                return `<span class="badge ${cls}">${status}</span>`;
            }

            function loadFromStorage() {
                try {
                    employees = JSON.parse(localStorage.getItem(STORAGE_KEY_EMPLOYEES)) || [];
                } catch (e) {
                    employees = [];
                }
                if (employees.length === 0) {
                    seedEmployees();
                }
            }

            function saveToStorage() {
                localStorage.setItem(STORAGE_KEY_EMPLOYEES, JSON.stringify(employees));
            }

            function seedEmployees() {
                employees = [
                    { id: 'e1', name: 'Alice Johnson', email: 'alice@rentease.com', phone: '+63 999 1111', role: 'Admin' },
                    { id: 'e2', name: 'Bob Smith', email: 'bob@rentease.com', phone: '+63 999 2222', role: 'Manager' },
                    { id: 'e3', name: 'Carol Tan', email: 'carol@rentease.com', phone: '+63 999 3333', role: 'Staff' },
                ];
                saveToStorage();
            }

            // ============================================================
            //  DATA MANAGER
            // ============================================================
            const DataManager = {
                async loadEmployees() {
                    if (USE_API) {
                        try {
                            const result = await ApiService.getEmployees();
                            if (result && result.length > 0) {
                                employees = result;
                                saveToStorage();
                                return;
                            }
                        } catch (err) {
                            console.warn('API load failed, using localStorage:', err);
                        }
                    }
                    loadFromStorage();
                },

                async saveEmployee(data) {
                    if (data.id) {
                        if (USE_API) {
                            const result = await ApiService.updateEmployee(data.id, data);
                            if (result) {
                                const idx = employees.findIndex(e => e.id === data.id);
                                if (idx !== -1) employees[idx] = result;
                                saveToStorage();
                                return result;
                            }
                        }
                        const idx = employees.findIndex(e => e.id === data.id);
                        if (idx !== -1) employees[idx] = { ...employees[idx], ...data };
                    } else {
                        const newItem = { ...data, id: 'e' + generateId() };
                        if (USE_API) {
                            const result = await ApiService.createEmployee(data);
                            if (result) {
                                employees.push(result);
                                saveToStorage();
                                return result;
                            }
                        }
                        employees.push(newItem);
                    }
                    saveToStorage();
                    return data;
                },

                async deleteEmployee(id) {
                    if (USE_API) await ApiService.deleteEmployee(id);
                    employees = employees.filter(e => e.id !== id);
                    saveToStorage();
                }
            };

            // ============================================================
            //  TOAST
            // ============================================================
            let toastTimeout = null;

            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                const icon = toast.querySelector('i');
                const msg = document.getElementById('toastMessage');
                msg.textContent = message;
                toast.className = 'toast';
                if (type === 'error') {
                    toast.classList.add('error');
                    icon.className = 'fas fa-exclamation-circle';
                } else if (type === 'warning') {
                    toast.classList.add('warning');
                    icon.className = 'fas fa-exclamation-triangle';
                } else {
                    icon.className = 'fas fa-check-circle';
                }
                clearTimeout(toastTimeout);
                void toast.offsetWidth;
                toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3500);
            }

            // ============================================================
            //  MODAL HELPERS
            // ============================================================
            function openModal(id) {
                document.getElementById(id).classList.add('open');
            }

            function closeModal(id) {
                document.getElementById(id).classList.remove('open');
            }

            document.querySelectorAll('.modal-overlay').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('open');
                    }
                });
            });
            document.querySelectorAll('[data-close]').forEach(el => {
                el.addEventListener('click', function() {
                    closeModal(this.dataset.close);
                });
            });

            // ============================================================
            //  RENDER EMPLOYEES
            // ============================================================
            function renderEmployees() {
                const tbody = document.getElementById('employeesTableBody');
                const count = document.getElementById('employeeCount');
                if (!employees || employees.length === 0) {
                    tbody.innerHTML =
                        `<tr><td colspan="5"><div class="empty-state"><i class="fas fa-user-tie"></i><p>No employees added yet. Click "Add Employee" to get started.</p></div></td></tr>`;
                    count.textContent = '· 0 total';
                    return;
                }
                count.textContent = `· ${employees.length} total`;
                tbody.innerHTML = employees.map(e => `
                    <tr>
                        <td><strong>${e.name}</strong></td>
                        <td>${e.email || '—'}</td>
                        <td>${e.phone || '—'}</td>
                        <td>${getStatusBadge(e.role)}</td>
                        <td style="text-align:center;">
                            <div class="action-group" style="justify-content:center;">
                                <button class="btn-edit" data-edit-employee="${e.id}"><i class="fas fa-pen"></i></button>
                                <button class="btn-danger" data-delete-employee="${e.id}"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `).join('');

                tbody.querySelectorAll('[data-edit-employee]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        openEditEmployeeModal(this.dataset.editEmployee);
                    });
                });
                tbody.querySelectorAll('[data-delete-employee]').forEach(btn => {
                    btn.addEventListener('click', function() {
                        confirmDelete(this.dataset.deleteEmployee);
                    });
                });
            }

            // ============================================================
            //  EMPLOYEE CRUD
            // ============================================================
            function openAddEmployeeModal() {
                document.getElementById('employeeModalTitle').textContent = 'Add Employee';
                document.getElementById('employeeSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Save Employee';
                document.getElementById('employeeFormId').value = '';
                document.getElementById('employeeForm').reset();
                openModal('employeeModal');
            }

            function openEditEmployeeModal(id) {
                const emp = employees.find(e => e.id === id);
                if (!emp) { showToast('Employee not found.', 'error'); return; }
                document.getElementById('employeeModalTitle').textContent = `Edit ${emp.name}`;
                document.getElementById('employeeSubmitBtn').innerHTML = '<i class="fas fa-save"></i> Update Employee';
                document.getElementById('employeeFormId').value = id;
                document.getElementById('employeeName').value = emp.name;
                document.getElementById('employeeEmail').value = emp.email || '';
                document.getElementById('employeePhone').value = emp.phone || '';
                document.getElementById('employeeRole').value = emp.role;
                openModal('employeeModal');
            }

            async function handleEmployeeFormSubmit(e) {
                e.preventDefault();
                const id = document.getElementById('employeeFormId').value;
                const name = document.getElementById('employeeName').value.trim();
                const email = document.getElementById('employeeEmail').value.trim();
                const phone = document.getElementById('employeePhone').value.trim();
                const role = document.getElementById('employeeRole').value;

                if (!name) { showToast('Please enter a name.', 'error'); return; }

                try {
                    const data = { name, email, phone, role };
                    if (id) data.id = id;
                    await DataManager.saveEmployee(data);
                    await DataManager.loadEmployees();
                    renderEmployees();
                    closeModal('employeeModal');
                    showToast(`Employee "${name}" ${id ? 'updated' : 'added'} successfully.`);
                } catch (err) {
                    showToast('Error: ' + err.message, 'error');
                }
            }

            async function deleteEmployee(id) {
                const emp = employees.find(e => e.id === id);
                if (!emp) return;
                await DataManager.deleteEmployee(id);
                await DataManager.loadEmployees();
                renderEmployees();
                showToast(`Employee "${emp.name}" deleted.`);
            }

            // ============================================================
            //  CONFIRM DELETE
            // ============================================================
            let deleteTargetId = null;

            function confirmDelete(id) {
                deleteTargetId = id;
                const emp = employees.find(e => e.id === id);
                const name = emp ? emp.name : 'this employee';
                document.getElementById('confirmMessage').textContent =
                    `Are you sure you want to delete "${name}"? This action cannot be undone.`;
                document.getElementById('confirmDeleteBtn').style.display = 'inline-flex';
                openModal('confirmModal');
            }

            document.getElementById('confirmDeleteBtn').addEventListener('click', async function() {
                if (!deleteTargetId) return;
                await deleteEmployee(deleteTargetId);
                deleteTargetId = null;
                closeModal('confirmModal');
            });

            // ============================================================
            //  PROFILE DROPDOWN
            // ============================================================
            const profileBtn = document.getElementById('profileBtn');
            const dropdown = document.getElementById('profileDropdown');
            let dropdownOpen = false;

            profileBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                dropdownOpen = !dropdownOpen;
                dropdown.classList.toggle('open', dropdownOpen);
            });

            document.addEventListener('click', function(e) {
                if (!profileBtn.contains(e.target)) {
                    dropdown.classList.remove('open');
                    dropdownOpen = false;
                }
            });

            dropdown.querySelectorAll('[data-action]').forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const action = this.dataset.action;
                    if (action === 'logout') {
                        if (confirm('Log out?')) {
                            sessionStorage.removeItem('rentease_session');
                            window.location.href = 'login.html';
                        }
                    } else if (action === 'profile') {
                        showToast('You are already on the profile page.', 'warning');
                    } else if (action === 'employees') {
                        showToast('You are already on the employees page.', 'warning');
                    }
                });
            });

            // ============================================================
            //  BUTTONS
            // ============================================================
            document.getElementById('addEmployeeBtn').addEventListener('click', openAddEmployeeModal);
            document.getElementById('backBtn').addEventListener('click', function() {
                window.location.href = 'index.html';
            });

            // ============================================================
            //  FORM SUBMIT
            // ============================================================
            document.getElementById('employeeForm').addEventListener('submit', handleEmployeeFormSubmit);

            // ============================================================
            //  RENDER ALL & INIT
            // ============================================================
            function renderAll() {
                renderEmployees();

                // Update API badge
                const badge = document.getElementById('apiBadge');
                if (badge) {
                    if (USE_API) {
                        badge.innerHTML = '<i class="fas fa-cloud"></i> API';
                        badge.className = 'api-badge';
                    } else {
                        badge.innerHTML = '<i class="fas fa-cloud"></i>';
                        badge.className = 'api-badge off';
                    }
                }
            }

            const username = window.__loggedUser || 'Admin';
            document.getElementById('profileUsername').textContent = username;

            (async function init() {
                await DataManager.loadEmployees();
                renderAll();
            })();

        })();
    </script>

</body>
</html>
